[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardd"
version = "0.1.0"
description = "Detection and instance segmentation of car body damage (CarDD) with a Damage Severity Index (DSI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pycocotools>=2.0.8",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]
# PyTorch with CUDA is installed separately, see README.

[project.optional-dependencies]
app = ["gradio>=4.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pre-commit>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
